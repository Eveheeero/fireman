[package]
name = "firebat"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "GUI of Fireball"
homepage = "https://crates.io/crates/firebat"

[dependencies]
fireball.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", default-features = true, features = ["clock"] }
eframe = "0.35"
egui = "0.35"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
default = []
keystone = ["fireball/keystone"]
unicorn = ["fireball/unicorn"]
full = ["keystone", "unicorn"]
