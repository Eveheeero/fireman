[package]
name = "fireman"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Running Binary of Fireball"
homepage = "https://crates.io/crates/fireman"

[dependencies]
fireball.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ratatui = "0.30"
crossterm = "0.29"

[features]
default = []
keystone = ["fireball/keystone"]
unicorn = ["fireball/unicorn"]
full = ["keystone", "unicorn"]
